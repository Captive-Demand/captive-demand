<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    /*@@COMMON@@*/
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #1a1512; overflow: hidden; display: flex; flex-direction: column;">
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
    <img src="captive-demand-logo.png" alt="Captive Demand" style="height: 26px; width: auto; filter: brightness(0) invert(1);">
    <span class="mono" style="font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(250,249,246,0.5);">Nashville, TN</span>
  </div>
  <!-- Compressed hero -->
  <section style="position: relative; height: 470px; display: flex; flex-direction: column; justify-content: flex-end; padding: 90px 20px 24px; box-sizing: border-box;">
    <div style="position: absolute; inset: 0; background: url(./hero-placeholder.jpg) center 35% / cover no-repeat; filter: saturate(0.5) brightness(0.6) contrast(1.05) sepia(0.2);"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,21,18,0.10) 0%, rgba(26,21,18,0.5) 40%, rgba(26,21,18,0.92) 75%, #1a1512 100%);"></div>
    <div class="noise"></div>
    <div style="position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #ff5501;">For multi-unit unique stays</span>
      <h1 class="display" style="margin: 0; font-weight: 300; font-size: 38px; line-height: 1.02; color: #FAF9F6;">Airbnb's cut is <span style="color: #ff5501; font-weight: 400;">15.5%</span> now. Your own booking site takes nothing.</h1>
      <a class="cta" href="#book">Book my 15-minute call <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    </div>
  </section>
  <!-- Below the fold stays on ink: tactile dark cards -->
  <section style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <span class="mono" style="font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(250,249,246,0.45);">Every section stays on ink</span>
    <div class="dark-card" style="border-radius: 20px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(250,249,246,0.45);">Your annual bookings through Airbnb</span>
      <div class="display" style="font-weight: 300; font-size: 38px; line-height: 1; color: #FAF9F6;">$50,000</div>
      <div style="position: relative; height: 24px; display: flex; align-items: center;">
        <div style="height: 6px; width: 100%; border-radius: 999px; background: rgba(250,249,246,0.14);"></div>
        <div style="position: absolute; left: 0; height: 6px; width: 8%; border-radius: 999px; background: #ff5501;"></div>
        <div style="position: absolute; left: 8%; margin-left: -12px; width: 24px; height: 24px; border-radius: 999px; background: #FAF9F6; box-shadow: 0 2px 6px rgba(0,0,0,0.4);"></div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="display" style="font-size: 30px; font-weight: 400; color: #ff5501; line-height: 1;">≈ $7,750</span>
        <span style="font-size: 14px; color: rgba(250,249,246,0.75);">a year in Airbnb fees</span>
      </div>
    </div>
    <div class="dark-card" style="border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span class="display" style="font-size: 17px; font-weight: 400; color: #FAF9F6;">Do I need a website already?</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FAF9F6" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </div>
  </section>
</div>
</x-dc>
</body>
</html>
